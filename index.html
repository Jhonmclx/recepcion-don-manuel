<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14232b">
<title>Recepción Don Manuel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
/* Layout: one column — scan box on top, received list below; scan opens a sheet with name + quantity */
:root{--bg:#eef2f1;--surface:#fff;--sunk:#e3e9e7;--ink:#14232b;--muted:#5a6b70;--line:#cfd9d6;--accent:#0b6e64;--accent-ink:#fff;--scan:#e3a21a;--scan-ink:#1d1606;--ok:#2c7a3a;--warn:#a85600;--warn-bg:#fdf0e1;
  --f-ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1618;--surface:#152024;--sunk:#1b292e;--ink:#e4eeec;--muted:#93a5a7;--line:#2a3a3f;--accent:#3db1a3;--accent-ink:#04201c;--scan:#f0b43a;--ok:#6cc17a;--warn:#f0a24a;--warn-bg:#33240f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1618;--surface:#152024;--sunk:#1b292e;--ink:#e4eeec;--muted:#93a5a7;--line:#2a3a3f;--accent:#3db1a3;--accent-ink:#04201c;--scan:#f0b43a;--ok:#6cc17a;--warn:#f0a24a;--warn-bg:#33240f;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-ui);margin:0}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:10px 100px;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.3rem;font-weight:800}
.sub{color:var(--muted);font-size:.8rem}
nav{display:flex;gap:2px;border-bottom:2px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);font:600 1rem var(--f-ui);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:0}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
button,.btn{font:600 1rem var(--f-ui);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:11px 16px;cursor:pointer}
.primary{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important}
.scanbtn{background:var(--scan)!important;color:var(--scan-ink)!important;border-color:var(--scan)!important}
.ghost{background:none;border-color:transparent;color:var(--muted)}
button:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid var(--accent);outline-offset:1px}
input{font:500 1.05rem var(--f-ui);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.mono{font-family:var(--f-mono)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scanbox{background:var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.scanbox .in{display:grid;grid-template-columns:1fr auto;gap:8px}
.scanbox input{font:500 1.3rem var(--f-mono);border:2px solid var(--scan)}
.scanbox .tip{color:color-mix(in srgb,var(--bg) 75%,transparent);font-size:.82rem}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label.btn{display:inline-flex;align-items:center;gap:6px;position:relative}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-height:48vh}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .guide{position:absolute;left:8%;right:8%;top:33%;bottom:33%;border:3px solid var(--scan);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.cam .stop{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border-color:rgba(255,255,255,.3);padding:8px 12px}
.sum{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-block:6px}
.sum b{font-family:var(--f-mono);font-size:1.2rem}
.sum span{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.it{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it.flash{background:color-mix(in srgb,var(--scan) 25%,var(--surface))}
.it .n{font-weight:600}
.it .c{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.it input{font:600 1.15rem var(--f-mono);text-align:right;padding:8px}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(10,20,24,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px}}
.pname{font-size:1.35rem;font-weight:800;line-height:1.2}
.pcode{font-family:var(--f-mono);color:var(--muted)}
.qty{font:600 2.2rem var(--f-mono)!important;text-align:center;padding:14px!important}
.lbl{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sug button{border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;font-weight:500}
.chip{font:600 .7rem var(--f-ui);text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.note{font-size:.82rem;color:var(--muted)}
pre.txt{white-space:pre-wrap;font:.85rem var(--f-mono);background:var(--sunk);padding:10px;border-radius:8px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header><div><h1>Recepción de mercancía</h1><div class="sub">Mercados Don Manuel</div></div><div class="sub" id="status">Cargando productos…</div></header>
  <nav><button data-tab="recibir" aria-selected="true">Recibir</button><button data-tab="hist" aria-selected="false">Historial</button></nav>

  <section id="v-recibir" style="display:flex;flex-direction:column;gap:12px">
    <div class="row"><input id="h-proveedor" placeholder="Proveedor" autocomplete="off"><input id="h-factura" placeholder="Factura No." autocomplete="off"></div>

    <div class="scanbox">
      <div class="cam" id="cam" hidden><video id="video" playsinline muted></video><div class="guide"></div><button class="stop" id="btnStop">Cerrar cámara</button></div>
      <div class="in"><input id="code" inputmode="numeric" autocomplete="off" placeholder="Escanee el código…"><button class="scanbtn" id="btnGo">OK</button></div>
      <div class="btns">
        <button class="scanbtn" id="btnCam">📷 Escanear con cámara</button>
        <label class="btn" for="photo" id="photoBtn" hidden>📷 Tomar foto del código<input type="file" id="photo" class="vh" accept="image/*" capture="environment"></label>
      </div>
      <div class="tip" id="tip">Con lector de códigos (USB o Bluetooth): deje el cursor en la casilla y dispare.</div>
    </div>

    <div class="sum" id="sum"></div>
    <div id="items"></div>
    <div class="btns" id="acts"></div>
  </section>

  <section id="v-hist" hidden style="display:flex;flex-direction:column;gap:12px"><div id="hist"></div></section>

  <div class="panel" id="srvPanel" hidden>
    <b>Servidor del almacén (Hoja de Google)</b>
    <input id="srvUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">
    <input id="srvKey" placeholder="Clave" autocomplete="off">
    <div class="btns"><button id="srvSave">Guardar y probar</button><button id="srvLink">Copiar link para otros celulares</button></div>
    <div class="note" id="srvMsg"></div>
  </div>
</div>

<div class="overlay" id="ov" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0;};
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);};
const safeId=s=>String(s).replace(/[^A-Za-z0-9_\-~:@+]/g,'_').slice(0,120);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let tT;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,2200);}
let ac;function beep(ok){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=ok?1250:300;g.gain.value=.1;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(ok?.1:.3));}catch(e){} try{navigator.vibrate&&navigator.vibrate(ok?60:[80,60,80]);}catch(e){}}
const isDesk=()=>matchMedia('(pointer:fine)').matches;

/* ---------- state ---------- */
const st={names:new Map(), codes:new Map(), all:[], draft:LS.get('rdm2-draft',null)||{proveedor:'',factura:'',lines:[]}, recs:[], mode:'local', db:null};
const saveDraft=()=>LS.set('rdm2-draft',st.draft);
for(const f of ['proveedor','factura']){ const el=$('#h-'+f); el.value=st.draft[f]||''; el.oninput=()=>{st.draft[f]=el.value;saveDraft();}; }

/* product index: code -> name */
function rebuild(baseItems, learned){
  const m=new Map(), all=[];
  for(const it of baseItems){ if(it.b&&it.n&&!m.has(it.b)){ m.set(it.b,it.n); all.push({code:it.b,name:it.n}); } if(it.k&&it.n&&!m.has(it.k)){ m.set(it.k,it.n); all.push({code:it.k,name:it.n}); } for(const a of (it.alias||[])) m.set(a,it.n); }
  for(const p of learned){ for(const c of p.codes){ if(!m.has(c)) all.push({code:c,name:p.name}); m.set(c,p.name); } }
  st.codes=m; st.all=all;
  $('#status').textContent=`${m.size.toLocaleString('es-CO')} códigos · ${st.mode==='db'?'compartido':st.mode==='srv'?'servidor del almacén':'este equipo'}`;
}
function findName(code){
  code=String(code).trim(); const v=[code, code.replace(/^0+/,'')]; if(/^\d{12}$/.test(code)) v.push('0'+code);
  for(const c of v){ const n=st.codes.get(c); if(n) return {code:c,name:n}; } return null;
}

/* ---------- storage backends ---------- */
// 1) Claude shared database   2) Google Sheet server   3) this device only
const SRV={get cfg(){return LS.get('rdm-srv',{});}, get on(){const c=this.cfg;return !!(c.url&&c.clave);}};
try{ const h=new URLSearchParams(location.hash.slice(1)); if(h.get('s')&&h.get('k')){ LS.set('rdm-srv',{url:atob(h.get('s')),clave:h.get('k')}); history.replaceState(null,'',location.pathname); } }catch(e){}
async function apiGet(accion){const c=SRV.cfg;return (await fetch(c.url+'?'+new URLSearchParams({accion,clave:c.clave}))).json();}
async function apiPost(b){const c=SRV.cfg;return (await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...b,clave:c.clave})})).json();}
async function flush(){ let q=LS.get('rdm-queue',[]); while(q.length){ try{ const r=await apiPost(q[0]); if(r&&r.error==='clave') break; }catch(e){ break; } q.shift(); LS.set('rdm-queue',q); } }
window.addEventListener('online',flush);

let dbBase=[], dbLearned=[];
async function startStorage(){
  const use=window.claude?.use;
  const db= use ? await use('db').catch(()=>null) : null;
  if(db){
    st.mode='db'; st.db=db;
    db.collection('catalogo').onSnapshot(s=>{ dbBase=[]; s.docs.forEach(d=>(d.data().items||[]).forEach(it=>dbBase.push({b:String(it[0]),n:it[1]}))); rebuild(dbBase,dbLearned); },()=>{});
    db.collection('productos').onSnapshot(s=>{ dbLearned=s.docs.map(d=>{const x=d.data();return {name:x.descripcion,codes:[...(x.barras||[]),...(x.codigo?[x.codigo]:[])]};}); rebuild(dbBase,dbLearned); },()=>{});
    db.collection('recepciones').orderBy('creado','desc').limit(200).onSnapshot(s=>{ st.recs=s.docs.map(d=>({id:d.id,...d.data()})); renderHist(); },()=>{});
    return;
  }
  $('#srvPanel').hidden=false;
  const local=LS.get('rdm2-learned',[]);
  if(SRV.on){
    st.mode='srv'; flush();
    try{ const r=await apiGet('productos'); if(r.ok){ LS.set('rdm2-base',r.items); } }catch(e){}
    rebuild(LS.get('rdm2-base',[]),local);
    try{ const r=await apiGet('recepciones'); if(r.ok){ st.recs=r.recs; renderHist(); } }catch(e){}
    return;
  }
  let base=LS.get('rdm2-base',null);
  if(!base){ try{ base=(await (await fetch('catalogo.json')).json()).items; }catch(e){ base=[]; } }
  rebuild(base,local); st.recs=LS.get('rdm2-recs',[]); renderHist();
}
async function learnProduct(code,name){
  const p={name,codes:[code]};
  if(st.mode==='db'){ try{ await st.db.collection('productos').doc(safeId('b'+code)).set({descripcion:name,barras:[code],proveedor:st.draft.proveedor||'',actualizado:Date.now()}); }catch(e){ toast('No se pudo guardar el producto en la base compartida.'); } return; }
  const local=LS.get('rdm2-learned',[]); local.push(p); LS.set('rdm2-learned',local); rebuild(LS.get('rdm2-base',[]),local);
  if(st.mode==='srv'){ const q=LS.get('rdm-queue',[]); q.push({accion:'producto',p:{b:code,n:name,v:st.draft.proveedor||''}}); LS.set('rdm-queue',q); flush(); }
}
async function storeRec(rec){
  if(st.mode==='db'){ await st.db.collection('recepciones').doc(safeId(rec.numero+'-'+Math.random().toString(36).slice(2,6))).set(rec); return; }
  st.recs.unshift(rec); LS.set('rdm2-recs',st.recs.slice(0,150)); renderHist();
  if(st.mode==='srv'){ const q=LS.get('rdm-queue',[]); q.push({accion:'recepcion',rec}); LS.set('rdm-queue',q); flush(); }
}

/* ---------- scan flow ---------- */
let paused=false;
function onCode(raw){
  const code=String(raw||'').trim(); $('#code').value=''; if(!code) return;
  paused=true;
  const f=findName(code); beep(!!f);
  const ya=st.draft.lines.find(l=>l.barras===(f?f.code:code));
  $('#sheet').innerHTML = f
    ? `<div class="pname">${esc(f.name)}</div><div class="pcode">${esc(code)}${ya?' · ya lleva <b>'+ya.cant+'</b>':''}</div>
       <div class="lbl">¿Cuántos llegaron?</div><input id="q" class="qty" type="number" inputmode="numeric" min="0" placeholder="0">
       <div class="btns"><button class="ghost" id="x">Cancelar</button><button class="primary" id="ok" style="flex:1">Agregar</button></div>`
    : `<div class="pname">Producto nuevo</div><div class="pcode">${esc(code)} · no está en la lista</div>
       <div class="lbl">Nombre del producto</div><input id="nm" autocomplete="off" placeholder="Escriba el nombre"><div class="sug" id="sug" hidden></div>
       <div class="lbl">¿Cuántos llegaron?</div><input id="q" class="qty" type="number" inputmode="numeric" min="0" placeholder="0">
       <div class="note">Queda guardado: la próxima vez sale el nombre solo.</div>
       <div class="btns"><button class="ghost" id="x">Cancelar</button><button class="primary" id="ok" style="flex:1">Agregar</button></div>`;
  $('#ov').hidden=false;
  setTimeout(()=>($('#nm')||$('#q'))?.focus(),60);
  if(!f){ $('#nm').oninput=()=>{ const q=$('#nm').value.toLowerCase().trim(), box=$('#sug'); if(q.length<3){box.hidden=true;return;}
    const r=st.all.filter(p=>p.name.toLowerCase().includes(q)).slice(0,5); box.hidden=!r.length;
    box.innerHTML=r.map((p,i)=>`<button data-i="${i}">${esc(p.name)}</button>`).join('');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#nm').value=r[+b.dataset.i].name; box.hidden=true; $('#q').focus(); }); }; }
  const go=async()=>{
    const q=num($('#q').value); if(q<=0){ toast('Escriba la cantidad'); $('#q').focus(); return; }
    let name=f?f.name:$('#nm').value.trim().toUpperCase(); if(!name){ toast('Escriba el nombre'); $('#nm').focus(); return; }
    const key=f?f.code:code;
    if(!f) learnProduct(code,name);
    const i=st.draft.lines.findIndex(l=>l.barras===key);
    if(i>=0){ const l=st.draft.lines.splice(i,1)[0]; l.cant=num(l.cant)+q; st.draft.lines.unshift(l); }
    else st.draft.lines.unshift({barras:key, descripcion:name, cant:q});
    saveDraft(); render(true); close(); toast(`+${q}  ${name}`);
  };
  $('#ok').onclick=go; $('#q').onkeydown=e=>{ if(e.key==='Enter') go(); }; if($('#nm')) $('#nm').onkeydown=e=>{ if(e.key==='Enter') $('#q').focus(); };
  $('#x').onclick=close;
}
function close(){ $('#ov').hidden=true; $('#sheet').innerHTML=''; paused=false; lastAt=Date.now(); if(isDesk()&&!camOn) $('#code').focus(); }
$('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') close(); });
$('#code').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); onCode(e.target.value); } });
$('#btnGo').onclick=()=>onCode($('#code').value);

/* ---------- live camera (works on own website; Claude blocks it) ---------- */
let stream=null, camOn=false, det=null, zx=null, lastCode='', lastAt=0;
const video=$('#video'), cv=document.createElement('canvas'), cx=cv.getContext('2d',{willReadFrequently:true});
$('#btnCam').onclick=async()=>{
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false}); }
  catch(e){ $('#btnCam').hidden=true; $('#photoBtn').hidden=false; $('#tip').textContent= st.mode==='db'
      ? 'Aquí dentro de Claude no se permite la cámara en vivo. Use “Tomar foto del código” o un lector de códigos.'
      : (e.name==='NotAllowedError'?'Permiso de cámara negado: actívelo en el navegador para este sitio.':'No se pudo abrir la cámara.'); return; }
  video.srcObject=stream; await video.play().catch(()=>{}); $('#cam').hidden=false; $('#btnCam').hidden=true; camOn=true;
  if('BarcodeDetector' in window){ try{ const sup=await BarcodeDetector.getSupportedFormats(); const w=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].filter(x=>sup.includes(x)); if(w.length) det=new BarcodeDetector({formats:w}); }catch(e){} }
  if(!det && window.ZXing){ const Z=ZXing,h=new Map(); h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF]); zx=new Z.MultiFormatReader(); zx.setHints(h); }
  loop();
};
function stopCam(){ camOn=false; if(stream) stream.getTracks().forEach(t=>t.stop()); stream=null; $('#cam').hidden=true; $('#btnCam').hidden=false; }
$('#btnStop').onclick=stopCam;
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopCam(); });
async function loop(){
  if(!camOn) return;
  if(!paused && video.readyState>=2){
    let code=null;
    try{ if(det){ const r=await det.detect(video); if(r.length) code=r[0].rawValue; }
      else if(zx){ const vw=video.videoWidth,vh=video.videoHeight,sw=Math.round(vw*.84),sh=Math.round(vh*.4); cv.width=sw; cv.height=sh; cx.drawImage(video,(vw-sw)/2,(vh-sh)/2,sw,sh,0,0,sw,sh);
        try{ code=zx.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(cv)))).getText(); }catch(e){ zx.reset(); } } }catch(e){}
    if(code && !(code===lastCode && Date.now()-lastAt<2500)){ lastCode=code; lastAt=Date.now(); onCode(code); }
  }
  setTimeout(()=>requestAnimationFrame(loop), det?80:140);
}
/* photo fallback */
$('#photo').onchange=async e=>{ const file=e.target.files[0]; e.target.value=''; if(!file) return; toast('Leyendo código…');
  const url=URL.createObjectURL(file);
  try{ const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;}); let code=null;
    if('BarcodeDetector' in window){ try{ const r=await new BarcodeDetector().detect(img); if(r.length) code=r[0].rawValue; }catch(e){} }
    if(!code && window.ZXing){ const Z=ZXing,h=new Map(); h.set(Z.DecodeHintType.TRY_HARDER,true); const rd=new Z.MultiFormatReader(); rd.setHints(h);
      for(const max of [1400,900]) for(const rot of [0,90]){ if(code) break; const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*s),hh=Math.round(img.naturalHeight*s);
        const c=document.createElement('canvas'); c.width=rot?hh:w; c.height=rot?w:hh; const g=c.getContext('2d'); if(rot){g.translate(hh,0);g.rotate(Math.PI/2);} g.drawImage(img,0,0,w,hh);
        try{ code=rd.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c)))).getText(); }catch(e){ rd.reset(); } } }
    code ? onCode(code) : (beep(false), toast('No se leyó el código. Acérquese más, con buena luz.'));
  }catch(e){ toast('No se pudo leer la foto.'); } finally { URL.revokeObjectURL(url); } };

/* ---------- list ---------- */
function render(flash){
  const L=st.draft.lines, und=L.reduce((s,l)=>s+num(l.cant),0);
  $('#sum').innerHTML=`<div><span>Productos</span> <b>${L.length}</b></div><div><span>Unidades</span> <b>${und}</b></div>`;
  $('#items').innerHTML = L.length ? `<div class="list">${L.map((l,i)=>`<div class="it" data-i="${i}"><div style="min-width:0"><div class="n">${esc(l.descripcion)}</div><div class="c">${esc(l.barras)}</div></div>
      <input type="number" inputmode="numeric" value="${esc(l.cant)}" aria-label="Cantidad"><button class="ghost" data-del aria-label="Quitar">✕</button></div>`).join('')}</div>`
    : `<div class="empty"><b>Aún no hay productos.</b><br>Escanee un código: sale el nombre y usted escribe cuántos llegaron.</div>`;
  $('#acts').innerHTML = L.length ? `<button class="primary" id="save">Guardar recepción</button><button id="copy">Copiar para WhatsApp</button><span id="clrW"><button class="ghost" id="clr">Borrar todo</button></span>` : '';
  if(L.length){ $('#save').onclick=saveRec; $('#copy').onclick=()=>copyText(textOf({...st.draft,lines:L}));
    $('#clr').onclick=()=>{ $('#clrW').innerHTML='<button class="ghost" id="clrY" style="color:var(--warn)">Sí, borrar la lista</button>'; $('#clrY').onclick=()=>{ st.draft.lines=[]; saveDraft(); render(); }; }; }
  if(flash){ const el=$('#items .it'); if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),800); } }
}
$('#items').addEventListener('change',e=>{ const r=e.target.closest('.it'); if(!r||e.target.tagName!=='INPUT') return; st.draft.lines[+r.dataset.i].cant=num(e.target.value); saveDraft(); render(); });
$('#items').addEventListener('click',e=>{ const r=e.target.closest('.it'); if(r&&e.target.dataset.del!=null){ st.draft.lines.splice(+r.dataset.i,1); saveDraft(); render(); } });
function textOf(r){ const und=r.lines.reduce((s,l)=>s+num(l.cant),0);
  return [`RECEPCIÓN${r.numero?' '+r.numero:''} — Mercados Don Manuel`,`Proveedor: ${r.proveedor||'—'} | Factura: ${r.factura||'—'}${r.fecha?' | '+r.fecha:''}`,'',...r.lines.map(l=>`${num(l.cant)}  ${l.descripcion}  (${l.barras})`),'',`Productos: ${r.lines.length} | Unidades: ${und}`].join('\n'); }
async function copyText(t){ try{ await navigator.clipboard.writeText(t); toast('Copiado: péguelo en WhatsApp'); }catch(e){ $('#ov').hidden=false; $('#sheet').innerHTML=`<div class="lbl">Seleccione y copie</div><pre class="txt">${esc(t)}</pre><button id="x">Cerrar</button>`; $('#x').onclick=close; } }
async function saveRec(){
  const d=st.draft; if(!d.proveedor){ toast('Escriba el proveedor'); $('#h-proveedor').focus(); return; }
  const z=n=>String(n).padStart(2,'0'), t=new Date();
  const rec={numero:`REC-${t.getFullYear()}${z(t.getMonth()+1)}${z(t.getDate())}-${z(t.getHours())}${z(t.getMinutes())}`, fecha:today(), proveedor:d.proveedor, factura:d.factura||'',
    lines:d.lines.map(l=>({barras:l.barras, descripcion:l.descripcion, cant:num(l.cant)})), creado:Date.now()};
  try{ await storeRec(rec); }catch(e){ toast('No se pudo guardar. Intente de nuevo.'); return; }
  st.draft={proveedor:'',factura:'',lines:[]}; $('#h-proveedor').value=''; $('#h-factura').value=''; saveDraft(); render(); toast('Recepción '+rec.numero+' guardada');
}

/* ---------- history ---------- */
function renderHist(){
  $('#hist').innerHTML = st.recs.length ? `<div class="list">${st.recs.map((r,i)=>`<div class="it" data-h="${i}" style="grid-template-columns:minmax(0,1fr) auto;cursor:pointer"><div><div class="n">${esc(r.proveedor)}${r.factura?' · <span class="mono">'+esc(r.factura)+'</span>':''}</div><div class="c">${esc(r.numero)} · ${esc(r.fecha)}</div></div><div class="mono">${(r.lines||[]).length} prod.</div></div>`).join('')}</div>`
    : '<div class="empty">Aún no hay recepciones guardadas.</div>';
  $('#hist').querySelectorAll('[data-h]').forEach(el=>el.onclick=()=>{ const r=st.recs[+el.dataset.h]; $('#ov').hidden=false;
    $('#sheet').innerHTML=`<div class="pname">${esc(r.proveedor)}</div><div class="pcode">${esc(r.numero)} · ${esc(r.factura||'')}</div><pre class="txt">${esc(textOf(r))}</pre><div class="btns"><button id="x">Cerrar</button><button class="primary" id="cp">Copiar para WhatsApp</button></div>`;
    $('#x').onclick=close; $('#cp').onclick=()=>copyText(textOf(r)); });
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',String(x===b))); $('#v-recibir').hidden=b.dataset.tab!=='recibir'; $('#v-hist').hidden=b.dataset.tab!=='hist'; if(b.dataset.tab!=='recibir') stopCam(); });

/* server settings (own website only) */
$('#srvUrl').value=SRV.cfg.url||''; $('#srvKey').value=SRV.cfg.clave||'';
$('#srvSave').onclick=async()=>{ const url=$('#srvUrl').value.trim(), clave=$('#srvKey').value.trim(); if(!url||!clave){ $('#srvMsg').textContent='Pegue la URL /exec y la clave.'; return; }
  LS.set('rdm-srv',{url,clave}); $('#srvMsg').textContent='Probando…';
  try{ const r=await apiGet('ping'); $('#srvMsg').textContent=r.ok?'Conectado ✔ Recargando…':'Clave incorrecta.'; if(r.ok) setTimeout(()=>location.reload(),600); }catch(e){ $('#srvMsg').textContent='No se pudo conectar.'; } };
$('#srvLink').onclick=async()=>{ const c=SRV.cfg; if(!SRV.on) return; const link=location.origin+location.pathname+'#s='+btoa(c.url)+'&k='+encodeURIComponent(c.clave); try{ await navigator.clipboard.writeText(link); toast('Link copiado'); }catch(e){ $('#srvMsg').textContent=link; } };

render(); startStorage();
if(isDesk()) $('#code').focus();
})();
</script>

</body></html>
